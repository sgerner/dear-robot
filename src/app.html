<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b1a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/pwa-icon.svg" />
    <script>
      (function () {
        const theme = localStorage.getItem('dear-robot.theme') || 'cinematic-dark';
        const chromeColors = {
          'cinematic-dark': '#090b1a',
          'midnight-glow': '#080611',
          'nordic-frost': '#1a2634',
          'sunset-mirage': '#1a1028',
          'forest-haven': '#0d2118',
          'solarized-light': '#fdf6e3',
          'boi-butter': '#332209',
          'daddy-please': '#2a1111',
          'himbo-juice': '#171034'
        };
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', chromeColors[theme] || chromeColors['cinematic-dark']);
        if (theme === 'solarized-light') {
          document.documentElement.style.colorScheme = 'light';
        } else {
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
