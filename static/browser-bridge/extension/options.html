<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dear Robot Browser Bridge settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Dear Robot Browser Bridge</h1>
      <p>
        Set the exact origin of your Dear Robot app. The bridge accepts recording
        commands and returns events only on this origin.
      </p>
      <form id="settings-form">
        <label for="app-origin">Dear Robot app origin</label>
        <input
          id="app-origin"
          name="app-origin"
          type="url"
          placeholder="https://mail.example.com"
          autocomplete="url"
          spellcheck="false"
          required
        />
        <p class="hint">
          Enter an origin only, without a path. HTTPS is required except for
          localhost development.
        </p>
        <div class="actions">
          <button type="submit">Save origin</button>
          <button id="clear-origin" class="secondary" type="button">Clear</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
